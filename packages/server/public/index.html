<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚁 Drone SSI Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header-logo { font-size: 2rem; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="text-center mb-5">
        <div class="header-logo">🚁</div>
        <h1>Auditoría de Drones (Blockchain)</h1>
        <p class="text-muted">Verificación inmutable de telemetría vía Hyperledger Fabric</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4 mb-4">
                <label for="didInput" class="form-label fw-bold">Identidad del Dron (DID):</label>
                <div class="input-group">
                    <input type="text" id="didInput" class="form-control" placeholder="did:key:z6Mk..." value="">
                    <button id="btnBuscar" class="btn btn-primary">🔍 Buscar Vuelos</button>
                </div>
            </div>
        </div>
    </div>

    <div class="row justify-content-center" id="resultSection" style="display: none;">
        <div class="col-md-10">
            <div class="card p-4">
                <h4 class="mb-3">📜 Historial de Vuelo (On-Chain)</h4>
                <div class="table-responsive">
                    <table class="table table-hover table-striped">
                        <thead class="table-dark">
                            <tr>
                                <th>Fecha (Timestamp)</th>
                                <th>Altitud (m)</th>
                                <th>Batería (%)</th>
                                <th>Temperatura (ºC)</th>
                                <th>TxID (Huella Blockchain)</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCuerpo">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
