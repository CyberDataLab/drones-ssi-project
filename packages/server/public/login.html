<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Drone SSI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> body { background: #e9ecef; display: flex; align-items: center; justify-content: center; height: 100vh; } </style>
</head>
<body>
<div class="card p-4 shadow" style="width: 400px;">
    <div class="text-center mb-4"><h1>🚁</h1><h3>Acceso Seguro</h3></div>
    <form id="loginForm">
        <div class="mb-3"><label>Usuario</label><input type="text" id="username" class="form-control" required></div>
        <div class="mb-3"><label>Clave</label><input type="password" id="password" class="form-control" required></div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
    <div id="errorMsg" class="text-danger text-center mt-3" style="display:none"></div>
    <div class="mt-3 text-center text-muted small"><p>Credenciales Demo: <strong>admin</strong> / <strong>admin</strong></p></div>
</div>
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        const err = document.getElementById('errorMsg');
        try {
            const res = await fetch('/auth/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, password: p}) });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('role', data.role);
                localStorage.setItem('username', data.username);
                window.location.href = '/index.html';
            } else { err.innerText = data.error; err.style.display = 'block'; }
        } catch (e) { err.innerText = "Error conexión"; err.style.display = 'block'; }
    });
</script>
</body>
</html>
